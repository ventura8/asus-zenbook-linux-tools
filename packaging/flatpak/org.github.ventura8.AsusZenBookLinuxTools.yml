id: org.github.ventura8.AsusZenBookLinuxTools
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: asus-zenbook-configure-wrapper
finish-args:
  - --share=network
  # Full host filesystem: configure wizard deploys systemd units, udev rules, and
  # payload under /usr/local, /etc, and /var/lib on the host (not inside /app).
  - --filesystem=host
  # systemctl daemon-reload / unit ops use the system bus (not session).
  - --system-talk-name=org.freedesktop.systemd1
modules:
  - name: asus-zenbook-linux-tools
    buildsystem: simple
    build-commands:
      - chmod +x packaging/stage-payload.sh packaging/asus-zenbook-configure
      - ./packaging/stage-payload.sh /app
      - >
        install -Dm644 assets/icons/asus-screenpad-toggle-symbolic.svg
        /app/share/icons/hicolor/scalable/apps/org.github.ventura8.AsusZenBookLinuxTools.svg
      - >
        install -Dm755 packaging/flatpak/asus-zenbook-configure-wrapper
        /app/bin/asus-zenbook-configure-wrapper
      - >
        install -Dm644
        packaging/flatpak/org.github.ventura8.AsusZenBookLinuxTools.metainfo.xml
        /app/share/metainfo/org.github.ventura8.AsusZenBookLinuxTools.metainfo.xml
      - >
        install -Dm644
        packaging/flatpak/org.github.ventura8.AsusZenBookLinuxTools.desktop
        /app/share/applications/org.github.ventura8.AsusZenBookLinuxTools.desktop
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .tools
          - .cache
          - reports
          - artifacts
          - .rpm-build
          - .rpm-build-*
          - packaging/snap/parts
          - packaging/snap/stage
          - packaging/snap/prime
          - packaging/flatpak/repo
          - packaging/flatpak/builddir
          - packaging/appimage/AppDir
