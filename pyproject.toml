[tool.poetry]
name = "asus-zenbook-linux-tools"
version = "1.0.0"
description = "ASUS ZenBook Linux support tools"
authors = ["Sergiu Alexandrescu <alexandrescu.sergiu@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4"
evdev = "==1.9.3"
dbus-python = "==1.4.0"

[tool.poetry.group.dev.dependencies]
PyYAML = "==6.0.3"
anybadge = "==1.16.0"
coverage = "==7.15.4"
pylint = "==4.0.6"
pytest = "==9.1.1"
pytest-timeout = "==2.4.0"
radon = "==6.0.1"
ruff = "==0.16.2"
yamllint = "==1.38.0"

# Host merge remaps Docker /workspace paths onto the checkout root.
[tool.coverage.paths]
source = [
    ".",
    "/workspace",
]

[tool.ruff]
line-length = 140
target-version = "py313"
