# SonarQube Cloud analysis. The key must match the project on SonarCloud exactly
# (Administration -> Update Key); the organization key is the org slug. CI
# supplies SONAR_TOKEN. A GitHub import provisions `<org>_<repo>` by default —
# rename it there to this key, or analysis fails with "project not found".
sonar.projectKey=asus-zenbook-linux-tools
sonar.organization=ventura8
sonar.projectName=asus-zenbook-linux-tools
# Version is read from the repo-root VERSION file by the CI job (sonar.projectVersion).

sonar.sources=bin,lib,gnome,scripts,install.sh,uninstall.sh,shared_imports.py,sitecustomize.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Generated, vendored, or packaging payload trees are not reviewed source.
sonar.exclusions=\
  po/**,\
  docs/**,\
  packaging/**/AppDir/**,\
  packaging/**/builddir/**,\
  packaging/**/repo/**,\
  packaging/arch/pkg/**,\
  packaging/arch/src/**,\
  packaging/snap/parts/**,\
  packaging/snap/stage/**,\
  packaging/snap/prime/**,\
  node_modules/**,\
  reports/**,\
  .venv/**

# Coverage produced by the pipeline's own gates (see .github/workflows/ci.yml
# coverage-merge job): coverage.py XML for Python, kcov Cobertura for shell.
sonar.python.coverage.reportPaths=reports/coverage/merged/coverage.xml
# Shell coverage: kcov Cobertura converted to Sonar's generic coverage XML by
# scripts/coverage/cobertura_to_sonar_generic.py (Cobertura is NOT accepted here).
sonar.coverageReportPaths=reports/coverage/merged/shell-coverage.xml

# Tests are exercised by the suites themselves; they are not product coverage.
sonar.coverage.exclusions=tests/**,scripts/**
